[project]
name = "mojo-jieba"
version = "0.1.0"
description = "Jieba-compatible Chinese word segmentation accelerated by Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
dependencies = ["numpy", "jieba==0.42.1"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
